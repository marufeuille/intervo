<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#38006e"/>
      <stop offset="100%" stop-color="#060010"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundclip">
      <rect width="512" height="512"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Perspective grid (bottom 40%) -->
  <!-- Vanishing point at (256, 345) -->
  <g opacity="0.45">
    <!-- Horizontal lines -->
    <line x1="0" y1="345" x2="512" y2="345" stroke="#7700ff" stroke-width="1.5"/>
    <line x1="0" y1="378" x2="512" y2="378" stroke="#7700ff" stroke-width="1"/>
    <line x1="0" y1="414" x2="512" y2="414" stroke="#7700ff" stroke-width="1"/>
    <line x1="0" y1="453" x2="512" y2="453" stroke="#7700ff" stroke-width="1"/>
    <line x1="0" y1="496" x2="512" y2="496" stroke="#7700ff" stroke-width="1"/>
    <!-- Converging lines -->
    <line x1="256" y1="345" x2="0"   y2="512" stroke="#7700ff" stroke-width="1"/>
    <line x1="256" y1="345" x2="75"  y2="512" stroke="#7700ff" stroke-width="1"/>
    <line x1="256" y1="345" x2="158" y2="512" stroke="#7700ff" stroke-width="1"/>
    <line x1="256" y1="345" x2="354" y2="512" stroke="#7700ff" stroke-width="1"/>
    <line x1="256" y1="345" x2="437" y2="512" stroke="#7700ff" stroke-width="1"/>
    <line x1="256" y1="345" x2="512" y2="512" stroke="#7700ff" stroke-width="1"/>
  </g>

  <!-- Crown/stem -->
  <rect x="232" y="50" width="48" height="28" rx="8" fill="#FF0088" filter="url(#glow)"/>

  <!-- Glow halo -->
  <circle cx="256" cy="244" r="175" fill="none" stroke="#00EEFF" stroke-width="36" opacity="0.10"/>

  <!-- Watch ring main -->
  <circle cx="256" cy="244" r="175" fill="#0b0020" stroke="#00EEFF" stroke-width="8"/>

  <!-- 4 main tick marks -->
  <line x1="256" y1="77"  x2="256" y2="103" stroke="#00EEFF" stroke-width="7" stroke-linecap="round"/>
  <line x1="423" y1="244" x2="397" y2="244" stroke="#00EEFF" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="411" x2="256" y2="385" stroke="#00EEFF" stroke-width="7" stroke-linecap="round"/>
  <line x1="89"  y1="244" x2="115" y2="244" stroke="#00EEFF" stroke-width="7" stroke-linecap="round"/>

  <!-- 4 diagonal small ticks -->
  <line x1="374" y1="127" x2="361" y2="149" stroke="#00EEFF" stroke-width="3.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="374" y1="361" x2="361" y2="339" stroke="#00EEFF" stroke-width="3.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="138" y1="361" x2="151" y2="339" stroke="#00EEFF" stroke-width="3.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="138" y1="127" x2="151" y2="149" stroke="#00EEFF" stroke-width="3.5" opacity="0.6" stroke-linecap="round"/>

  <!-- Second hand (magenta, glowing) — pointing ~1 o'clock -->
  <line x1="256" y1="244" x2="318" y2="96"  stroke="#FF0088" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Counterweight -->
  <line x1="256" y1="244" x2="232" y2="302" stroke="#FF0088" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center hub -->
  <circle cx="256" cy="244" r="16" fill="#FF0088" filter="url(#glow)"/>
  <circle cx="256" cy="244" r="7"  fill="white"/>
</svg>
