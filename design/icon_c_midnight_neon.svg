<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softneon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pure black background -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Subtle radial vignette -->
  <circle cx="256" cy="256" r="280" fill="none" stroke="#1a0030" stroke-width="80" opacity="0.6"/>

  <!-- Crown — bright orange/amber (like neon sign mounting) -->
  <rect x="232" y="48" width="48" height="30" rx="8" fill="#FF6600" filter="url(#neon)"/>

  <!-- Glow halo ring (outer) -->
  <circle cx="256" cy="258" r="178" fill="none" stroke="#FF1493" stroke-width="32" opacity="0.12" filter="url(#softneon)"/>

  <!-- Main neon ring (double layer for glow) -->
  <circle cx="256" cy="258" r="178" fill="none" stroke="#FF1493" stroke-width="14" opacity="0.4"/>
  <circle cx="256" cy="258" r="178" fill="none" stroke="#FF69B4" stroke-width="5"/>

  <!-- Inner ring (thinner, dimmer) -->
  <circle cx="256" cy="258" r="152" fill="none" stroke="#FF1493" stroke-width="1.5" opacity="0.3"/>

  <!-- Tick marks at 12, 3, 6, 9 — neon -->
  <line x1="256" y1="84"  x2="256" y2="112" stroke="#FF69B4" stroke-width="7" stroke-linecap="round" filter="url(#softneon)"/>
  <line x1="426" y1="258" x2="398" y2="258" stroke="#FF69B4" stroke-width="7" stroke-linecap="round" filter="url(#softneon)"/>
  <line x1="256" y1="432" x2="256" y2="404" stroke="#FF69B4" stroke-width="7" stroke-linecap="round" filter="url(#softneon)"/>
  <line x1="86"  y1="258" x2="114" y2="258" stroke="#FF69B4" stroke-width="7" stroke-linecap="round" filter="url(#softneon)"/>

  <!-- Diagonal small ticks -->
  <line x1="380" y1="132" x2="367" y2="152" stroke="#FF1493" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <line x1="380" y1="384" x2="367" y2="364" stroke="#FF1493" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <line x1="132" y1="384" x2="145" y2="364" stroke="#FF1493" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <line x1="132" y1="132" x2="145" y2="152" stroke="#FF1493" stroke-width="4" opacity="0.5" stroke-linecap="round"/>

  <!-- Second hand (orange/amber neon) — pointing ~1 o'clock -->
  <line x1="256" y1="258" x2="318" y2="104" stroke="#FF6600" stroke-width="6" stroke-linecap="round" filter="url(#neon)"/>
  <!-- Counterweight -->
  <line x1="256" y1="258" x2="232" y2="316" stroke="#FF6600" stroke-width="5" stroke-linecap="round" filter="url(#neon)"/>

  <!-- Center hub -->
  <circle cx="256" cy="258" r="18" fill="#FF6600" filter="url(#neon)"/>
  <circle cx="256" cy="258" r="8"  fill="white"/>
</svg>
