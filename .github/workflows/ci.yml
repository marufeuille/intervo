name: CI

on:
  push:
    branches: [main]
    # ドキュメントのみの変更ではビルドを回さない（変更が全て docs/** か Markdown のときスキップ）
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - LICENSE

# JS アクションを Node.js 24 で実行（Node.js 20 廃止予告の解消）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 軽量チェック（PR・main push 共通）: 「壊れてないか」を JVM だけで高速検証する層。
  # コンパイル + Lint（静的解析）+ ユニットテスト。実機は起動しない。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.2.0

      # companion は google-services.json（非コミット）が必要なため、CI では :app のみ対象
      - name: Build, lint and run unit tests
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/problems/

  # 実機 E2E（main push のみ）: 「画面・体験が壊れてないか」を Wear OS エミュレータで検証する層。
  # マージ直後に体験の破壊を早期検知するのが目的（main を緑に保つ努力）。PR では走らせず開発フィードバックを高速に保つ。
  # 配信を確実に止める「リリース前ゲート」は release.yml 側の e2e ジョブ（release が needs: e2e）で別途担保する。
  instrumented-test:
    name: E2E (Wear OS emulator)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle キャッシュの書き込みは build ジョブに任せ、ここは read-only（保存処理の時間を節約）
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: true

      # Android エミュレータのハードウェアアクセラレーション（KVM）を有効化
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD（とブート済みスナップショット）をキャッシュして 2 回目以降の起動を高速化
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-wear-34-x86_64

      # キャッシュミス時のみ、AVD を作成してブート済みスナップショットを生成・保存
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated."

      # Wear OS 5 (API 34, x86_64) のエミュレータ上で connectedDebugAndroidTest を実行
      - name: Run E2E on Wear OS emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest

      # PASS/FAIL 表をジョブサマリに出力（結果は GitHub Actions の Summary タブで一覧できる）
      - name: Write E2E summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, html, re
          files = glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)
          print("## E2E シナリオ結果\n")
          if not files:
              print("レポートが見つかりませんでした（エミュレータ起動やビルドで失敗した可能性）。")
              raise SystemExit
          print("| 結果 | シナリオ |")
          print("| --- | --- |")
          total = fail = 0
          for fp in files:
              t = open(fp).read()
              for m in re.finditer(r'<testcase name="([^"]+)".*?(?:/>|>(.*?)</testcase>)', t, re.S):
                  name, body = m.group(1), m.group(2) or ""
                  failed = re.search(r'<(failure|error)\b', body) is not None
                  total += 1; fail += 1 if failed else 0
                  print(f"| {'❌ FAIL' if failed else '✅ PASS'} | {html.unescape(name)} |")
          print(f"\n**{total - fail}/{total} passed**")
          PY

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  # companion（スマホアプリ）の実機 E2E。Wear の instrumented-test と並列で、phone エミュレータ上で
  # connectedDebugAndroidTest を走らせる。main push 的み（PR では走らない）点も Wear と同一。
  instrumented-test-companion:
    name: E2E (phone emulator)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle キャッシュの書き込みは build ジョブに任せ、ここは read-only
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: true

      # Android エミュレータのハードウェアアクセラレーション（KVM）を有効化
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # phone エミュレータの AVD（とブート済みスナップショット）をキャッシュ。Wear のキーと衝突させない。
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache-companion
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-google-apis-34-x86_64

      # キャッシュミス時のみ、AVD を作成してブート済みスナップショットを生成・保存
      - name: Create AVD snapshot
        if: steps.avd-cache-companion.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated."

      # phone（API 34, google_apis, x86_64）エミュレータ上で companion の connectedDebugAndroidTest を実行
      - name: Run E2E on phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :companion:connectedDebugAndroidTest

      # PASS/FAIL 表をジョブサマリに出力（companion の結果を集計）
      - name: Write E2E summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, html, re
          files = glob.glob("companion/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)
          print("## Companion E2E シナリオ結果\n")
          if not files:
              print("レポートが見つかりませんでした（エミュレータ起動やビルドで失敗した可能性）。")
              raise SystemExit
          print("| 結果 | シナリオ |")
          print("| --- | --- |")
          total = fail = 0
          for fp in files:
              t = open(fp).read()
              for m in re.finditer(r'<testcase name="([^"]+)".*?(?:/>|>(.*?)</testcase>)', t, re.S):
                  name, body = m.group(1), m.group(2) or ""
                  failed = re.search(r'<(failure|error)\b', body) is not None
                  total += 1; fail += 1 if failed else 0
                  print(f"| {'❌ FAIL' if failed else '✅ PASS'} | {html.unescape(name)} |")
          print(f"\n**{total - fail}/{total} passed**")
          PY

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-companion-report
          path: |
            companion/build/reports/androidTests/
            companion/build/outputs/androidTest-results/
