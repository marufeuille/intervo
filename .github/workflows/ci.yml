name: CI

on:
  push:
    branches: [main]
  pull_request:

# JS アクションを Node.js 24 で実行（Node.js 20 廃止予告の解消）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # companion は google-services.json（非コミット）が必要なため、CI では :app のみ対象
      - name: Build and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Check release build (R8)
        run: ./gradlew :app:assembleRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/problems/

  instrumented-test:
    name: E2E (Wear OS emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Android エミュレータのハードウェアアクセラレーション（KVM）を有効化
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD（とブート済みスナップショット）をキャッシュして 2 回目以降の起動を高速化
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-wear-34-x86_64

      # キャッシュミス時のみ、AVD を作成してブート済みスナップショットを生成・保存
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated."

      # Wear OS 5 (API 34, x86_64) のエミュレータ上で connectedDebugAndroidTest を実行
      - name: Run E2E on Wear OS emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest

      # PASS/FAIL 表をジョブサマリに出力（結果は GitHub Actions の Summary タブで一覧できる）
      - name: Write E2E summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, html, re
          files = glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)
          print("## E2E シナリオ結果\n")
          if not files:
              print("レポートが見つかりませんでした（エミュレータ起動やビルドで失敗した可能性）。")
              raise SystemExit
          print("| 結果 | シナリオ |")
          print("| --- | --- |")
          total = fail = 0
          for fp in files:
              t = open(fp).read()
              for m in re.finditer(r'<testcase name="([^"]+)".*?(?:/>|>(.*?)</testcase>)', t, re.S):
                  name, body = m.group(1), m.group(2) or ""
                  failed = re.search(r'<(failure|error)\b', body) is not None
                  total += 1; fail += 1 if failed else 0
                  print(f"| {'❌ FAIL' if failed else '✅ PASS'} | {html.unescape(name)} |")
          print(f"\n**{total - fail}/{total} passed**")
          PY

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
