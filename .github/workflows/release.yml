name: Release

# タグ vX.Y.Z を push すると、app/companion を署名ビルドして Play の内部テストへ配信する。
# workflow_dispatch では配信手前（復元・テスト・ビルド）までを検証できる（配信は tag push 時のみ）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "確認用バージョン名（例 1.7.2）。配信はされず、ビルド検証のみ。"
        required: false

# JS アクションを Node.js 24 で実行（ci.yml と同様）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 最小権限。Play 配信は別途サービスアカウント Secret を使うため GITHUB_TOKEN は読み取りで足りる。
permissions:
  contents: read

jobs:
  # リリース前ゲート: 「画面・体験が壊れてないか」を Wear OS エミュレータで検証する。
  # 落ちたら後続の release ジョブ（署名・ビルド・配信）が走らず、配信されない。
  # tag push / workflow_dispatch の両方で走るため、タグを打つ前に dispatch で事前検証できる。
  e2e:
    name: E2E (Wear OS emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Android エミュレータのハードウェアアクセラレーション（KVM）を有効化
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD（とブート済みスナップショット）をキャッシュして 2 回目以降の起動を高速化
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-wear-34-x86_64

      # キャッシュミス時のみ、AVD を作成してブート済みスナップショットを生成・保存
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated."

      # Wear OS 5 (API 34, x86_64) のエミュレータ上で connectedDebugAndroidTest を実行
      - name: Run E2E on Wear OS emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest

      # PASS/FAIL 表をジョブサマリに出力（結果は GitHub Actions の Summary タブで一覧できる）
      - name: Write E2E summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, html, re
          files = glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)
          print("## E2E シナリオ結果\n")
          if not files:
              print("レポートが見つかりませんでした（エミュレータ起動やビルドで失敗した可能性）。")
              raise SystemExit
          print("| 結果 | シナリオ |")
          print("| --- | --- |")
          total = fail = 0
          for fp in files:
              t = open(fp).read()
              for m in re.finditer(r'<testcase name="([^"]+)".*?(?:/>|>(.*?)</testcase>)', t, re.S):
                  name, body = m.group(1), m.group(2) or ""
                  failed = re.search(r'<(failure|error)\b', body) is not None
                  total += 1; fail += 1 if failed else 0
                  print(f"| {'❌ FAIL' if failed else '✅ PASS'} | {html.unescape(name)} |")
          print(f"\n**{total - fail}/{total} passed**")
          PY

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  # companion（スマホアプリ）のリリース前ゲート。phone エミュレータで connectedDebugAndroidTest を走らせ、
  # 落ちたら後続の release（署名・ビルド・配信）が走らない。Wear の e2e ジョブと並列。
  # tag push / workflow_dispatch の両方で走り、dispatch で事前検証できる点も Wear 側と同一。
  e2e-companion:
    name: E2E (phone emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Android エミュレータのハードウェアアクセラレーション（KVM）を有効化
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # phone エミュレータの AVD（とブート済みスナップショット）をキャッシュ。Wear のキーと衝突させない。
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache-companion
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-google-apis-34-x86_64

      # キャッシュミス時のみ、AVD を作成してブート済みスナップショットを生成・保存
      - name: Create AVD snapshot
        if: steps.avd-cache-companion.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated."

      # phone（API 34, google_apis, x86_64）エミュレータ上で companion の connectedDebugAndroidTest を実行
      - name: Run E2E on phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :companion:connectedDebugAndroidTest

      # PASS/FAIL 表をジョブサマリに出力（companion の結果を集計）
      - name: Write E2E summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, html, re
          files = glob.glob("companion/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)
          print("## Companion E2E シナリオ結果\n")
          if not files:
              print("レポートが見つかりませんでした（エミュレータ起動やビルドで失敗した可能性）。")
              raise SystemExit
          print("| 結果 | シナリオ |")
          print("| --- | --- |")
          total = fail = 0
          for fp in files:
              t = open(fp).read()
              for m in re.finditer(r'<testcase name="([^"]+)".*?(?:/>|>(.*?)</testcase>)', t, re.S):
                  name, body = m.group(1), m.group(2) or ""
                  failed = re.search(r'<(failure|error)\b', body) is not None
                  total += 1; fail += 1 if failed else 0
                  print(f"| {'❌ FAIL' if failed else '✅ PASS'} | {html.unescape(name)} |")
          print(f"\n**{total - fail}/{total} passed**")
          PY

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-companion-report
          path: |
            companion/build/reports/androidTests/
            companion/build/outputs/androidTest-results/

  release:
    # 両 E2E（Wear/phone）ゲートが通ってから署名・ビルド・配信する
    needs: [e2e, e2e-companion]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # タグ vX.Y.Z → VERSION_NAME=X.Y.Z。dispatch は入力値（無ければビルド確認用のダミー）。
      - name: Resolve version name
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=${INPUT_VERSION:-0.0.0-dispatch}" >> "$GITHUB_ENV"
          fi

      # 署名鍵を Secrets から復元。既存の signingConfig（keystore.properties を読む）が
      # そのまま機能するため build.gradle 側の変更は不要。
      # storeFile は build.gradle の file(...) がモジュール基準で解決するため、
      # app/companion 双方から確実に届く絶対パス（$GITHUB_WORKSPACE 直下）で指定する。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/keystore-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/keystore-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # companion は Firebase Auth / App Check を使うため google-services.json が必須。
      # release variant 用は companion/src/release/ に置く（ローカルと同じ配置）。
      - name: Restore google-services.json (release)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p companion/src/release
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > companion/src/release/google-services.json

      # 配信前のガード。失敗したら以降を止める。
      - name: Unit tests (guard)
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release bundles
        run: ./gradlew :app:bundleRelease :companion:bundleRelease

      # Play の「最新情報」を docs/release-notes-<VERSION>.md の先頭コードフェンス
      #（= 「Play Console『最新情報』用」ブロック）から抽出し、whatsnew-<locale> を生成する。
      # ノートが無い／空ならタグリリースを止める（リリースノート無しでの配信を防ぐ）。
      - name: Prepare Play release notes (whatsnew)
        if: github.ref_type == 'tag'
        run: |
          NOTES_FILE="docs/release-notes-${VERSION_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::$NOTES_FILE が見つかりません。リリースノート（最新情報）を用意してからタグを打ってください。"
            exit 1
          fi
          mkdir -p whatsnew
          # 「Play Console『最新情報』用」見出し以降、最初の ``` フェンス内の行だけを出力。
          # scripts/check_release_notes.py の抽出仕様と一致させること。
          awk '
            /Play Console「最新情報」用/ {seen=1; next}
            seen && /^```/ {c++; next}
            seen && c==1 {print}
          ' "$NOTES_FILE" > whatsnew/whatsnew-ja-JP
          if [ ! -s whatsnew/whatsnew-ja-JP ]; then
            echo "::error::$NOTES_FILE の先頭コードフェンス（最新情報）が空です。"
            exit 1
          fi
          echo "----- whatsnew (ja-JP) -----"
          cat whatsnew/whatsnew-ja-JP

      # 内部テストへ配信（tag push のときのみ）。
      # app(Wear) と companion(phone) は applicationId を共有するマルチフォームファクタ構成で、
      # Play 上はフォームファクタ別トラックに分かれる。Play Developer API ではフォームファクタ別
      # トラックを「<prefix>:<defaultTrack>」で表す（Wear OS は wear: プレフィックス）。
      # → app(Wear)=wear:internal / companion(phone)=internal にそれぞれ配信する。
      # 1 リリースに両 AAB を混在させたり、Wear を internal に出すと commit に失敗する。
      - name: Upload app (Wear) to Play (wear:internal track)
        if: github.ref_type == 'tag'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.marufeuille.intervo
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: wear:internal
          status: completed
          whatsNewDirectory: whatsnew

      - name: Upload companion (phone) to Play (internal track)
        if: github.ref_type == 'tag'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.marufeuille.intervo
          releaseFiles: companion/build/outputs/bundle/release/companion-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: whatsnew

      - name: Upload AAB artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-aabs
          path: |
            app/build/outputs/bundle/release/app-release.aab
            companion/build/outputs/bundle/release/companion-release.aab
