name: Validate release notes

# リリースノート（docs/release-notes-<VERSION>.md）が CI の抽出フォーマットに適合しているかを
# 変更時に検証する。これにより「最新情報」が常に Play へ正しく反映される形式を担保する。
# 旧フォーマットの過去ファイルで落ちないよう、検証対象は「この変更で追加/変更されたファイル」のみ。
on:
  pull_request:
    paths: ["docs/release-notes-*.md"]
  push:
    branches: [main]
    paths: ["docs/release-notes-*.md"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate changed release notes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE...HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE...HEAD"
          else
            range="HEAD~1...HEAD"
          fi
          echo "diff range: $range"
          files=$(git diff --name-only --diff-filter=AM $range -- 'docs/release-notes-*.md' || true)
          if [ -z "$files" ]; then
            echo "変更されたリリースノートはありません（スキップ）"
            exit 0
          fi
          echo "検証対象:"
          echo "$files"
          python3 scripts/check_release_notes.py $files
