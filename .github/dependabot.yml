# Dependabot: 依存更新・脆弱性検知の自動化 (Issue #19)
#
# - github-actions: 週次・1 PR にグルーピング
#   （ci.yml/release.yml/validate-release-notes.yml の action の破壊的変更・改ざん対策）
# - gradle: 月次・グルーピング・PR 上限 5
#   （androidx の alpha/rc による PR 量産を抑制。version catalog gradle/libs.versions.toml に対応）
#
# versionCode は semver から自動採番のため Dependabot が build.gradle.kts を触ることはない。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # 下記は AGP 9.1 / compileSdk 37 もしくは未リリースの KSP を要求するため据え置き中。
    # ツールチェーン移行（KSP×AGP9 解消待ち）は #31 で追跡し、解消したら本 ignore を解除する。
    ignore:
      # core 1.19.0+ は compileSdk 37 / AGP 9.1 必須
      - dependency-name: "androidx.core:core"
        versions: [">=1.19.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
      # health-connect 1.2.0-alpha+ は compileSdk 37 / AGP 9.1 必須
      - dependency-name: "androidx.health.connect:connect-client"
        versions: [">=1.2.0-alpha01"]
      # Kotlin 2.3.0+ は対応する KSP が未リリース（Room の KSP が動かない）
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">=2.3.0"]
    groups:
      androidx:
        patterns:
          - "androidx.*"
      firebase:
        patterns:
          - "com.google.firebase*"
          - "com.google.gms*"
