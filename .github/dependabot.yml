# Dependabot: 依存更新・脆弱性検知の自動化 (Issue #19)
#
# - github-actions: 週次・1 PR にグルーピング
#   （ci.yml/release.yml/validate-release-notes.yml の action の破壊的変更・改ざん対策）
# - gradle: 月次・グルーピング・PR 上限 5
#   （androidx の alpha/rc による PR 量産を抑制。version catalog gradle/libs.versions.toml に対応）
#
# versionCode は semver から自動採番のため Dependabot が build.gradle.kts を触ることはない。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # 下記は AGP 9.1 / compileSdk 37 もしくは未リリースの KSP を要求するため据え置き中。
    # ツールチェーン移行（KSP×AGP9 解消待ち）は #31 で追跡し、解消したら本 ignore を解除する。
    ignore:
      # core 1.19.0+ は compileSdk 37 / AGP 9.1 必須
      - dependency-name: "androidx.core:core"
        versions: [">=1.19.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
      # health-connect 1.2.0-alpha+ は compileSdk 37 / AGP 9.1 必須
      - dependency-name: "androidx.health.connect:connect-client"
        versions: [">=1.2.0-alpha01"]
      # Kotlin 2.3.0+ は対応する KSP が未リリース（Room の KSP が動かない）
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">=2.3.0"]
      # KSP は org.jetbrains.kotlin:* に一致しない別 artifact。2.3.0+ は Kotlin 2.3 必須で
      # プラグイン適用に失敗する（PR #37 で確認）。
      - dependency-name: "com.google.devtools.ksp"
        versions: [">=2.3.0"]
      # AGP 9.x は Gradle 9.4.1+ / compileSdk 37 を要求しツールチェーン移行が前提
      # （PR #35 は "Minimum supported Gradle version is 9.4.1" で失敗）。
      - dependency-name: "com.android.application"
        versions: [">=9.0.0"]
      - dependency-name: "com.android.library"
        versions: [">=9.0.0"]
      - dependency-name: "com.android.tools.build:gradle"
        versions: [">=9.0.0"]
      # Gradle wrapper 9.x は AGP9 移行とセット。単体ではビルドが通っても据え置く。
      - dependency-name: "gradle"
        versions: [">=9.0"]
    groups:
      androidx:
        patterns:
          - "androidx.*"
      firebase:
        patterns:
          - "com.google.firebase*"
          - "com.google.gms*"
